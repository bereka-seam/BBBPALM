<!DOCTYPE html>
<html lang="ko">
<head>  
  <meta charset="UTF-8" />
<title>브라우저 탭에 뜰 제목</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="BBB팜스쿨 출결&과제">
    <meta property="og:url" content="https://bbbpalm.netlify.app">

  
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>팜스쿨 12기 과제&amp;출결표</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
 
    :root {
      --bg-main: #F5F0E8;
      --bg-card: #EDE7D9;
      --bg-table-head: #E4DDD0;
      --border: #C8BCA8;
      --border-light: #D8D0C0;
      --text-primary: #3B2E1E;
      --text-secondary: #6B5744;
      --text-tertiary: #9C8370;
      --accent: #7C5C3E;
      --accent-hover: #5E4530;
      --check-active: #7C5C3E;
      --white-card: #F9F5EE;
      --font-sans: 'Noto Sans KR', sans-serif;
    }
 
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600&display=swap');
 
    body { background: var(--bg-main); font-family: var(--font-sans); }
 
    .app-wrap { padding: 1.25rem 1rem 2.5rem; max-width: 380px; margin: 0 auto; }
 
    .header { text-align: center; padding: 1.75rem 1rem 1.25rem; border-bottom: 0.5px solid var(--border); margin-bottom: 1.25rem; }
    .header-sub { font-size: 11px; letter-spacing: 0.18em; color: var(--text-tertiary); text-transform: uppercase; margin-bottom: 0.5rem; }
    .header-title { font-size: 18px; font-weight: 600; color: var(--text-primary); line-height: 1.4; letter-spacing: -0.01em; }
 
    .meta-row { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-bottom: 1rem; }
    .meta-field { display: flex; flex-direction: column; gap: 5px; }
    .meta-label { font-size: 11px; letter-spacing: 0.09em; color: var(--text-tertiary); text-transform: uppercase; }
    .meta-field input {
      background: var(--white-card); border: 0.5px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-size: 13px; font-family: var(--font-sans);
      color: var(--text-primary); width: 100%; outline: none;
    }
    .meta-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(124,92,62,0.1); }
    .meta-field input::placeholder { color: var(--text-tertiary); font-size: 12px; }
 
    .section-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .section-title { font-size: 11px; letter-spacing: 0.1em; color: var(--text-tertiary); text-transform: uppercase; }
 
    .table-wrap { border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(60,40,20,0.06); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
 
    thead th {
      background: var(--bg-table-head); padding: 10px 0;
      font-size: 11px; font-weight: 600; color: var(--text-secondary);
      text-align: center; border-bottom: 0.5px solid var(--border); letter-spacing: 0.03em;
    }
    thead th:first-child { text-align: left; padding-left: 14px; }
    thead th:last-child { padding-right: 14px; }
 
    tbody tr { border-bottom: 0.5px solid var(--border-light); background: var(--white-card); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(even) { background: #F2EDE3; }
 
    td { padding: 9px 0; text-align: center; vertical-align: middle; }
    td:first-child { padding-left: 14px; text-align: left; }
    td:last-child { padding-right: 14px; }
 
    .name-input {
      background: transparent; border: none; font-size: 13px;
      font-family: var(--font-sans); color: var(--text-primary); width: 100%; outline: none; padding: 0;
    }
    .name-input::placeholder { color: var(--text-tertiary); font-size: 12px; }
 
    .check-wrap { display: flex; align-items: center; justify-content: center; }
    .check-box {
      width: 22px; height: 22px; border: 0.5px solid var(--border); border-radius: 6px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      background: var(--white-card); transition: background 0.15s, border-color 0.15s; flex-shrink: 0;
    }
    .check-box i { font-size: 13px; color: transparent; transition: color 0.12s; }
    .check-box.active { background: var(--check-active); border-color: var(--check-active); }
    .check-box.active i { color: #F9F5EE; }
 
    .summary-row { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 1.25rem; }
    .summary-card { background: var(--bg-card); border: 0.5px solid var(--border-light); border-radius: 10px; padding: 0.875rem 1rem; text-align: center; }
    .summary-card .s-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 5px; letter-spacing: 0.04em; }
    .summary-card .s-num { font-size: 20px; font-weight: 600; color: var(--text-primary); }
 
    .save-btn {
      margin-top: 1.25rem; width: 100%; padding: 13px; background: var(--accent);
      border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
      font-family: var(--font-sans); color: #F9F5EE; cursor: pointer; transition: background 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 6px; letter-spacing: 0.02em;
    }
    .save-btn:hover { background: var(--accent-hover); }
    .save-btn:disabled { opacity: 0.5; cursor: not-allowed; }
 
    .footer { text-align: center; margin-top: 2rem; padding-top: 1.25rem; border-top: 0.5px solid var(--border); font-size: 11px; letter-spacing: 0.1em; color: var(--text-tertiary); text-transform: uppercase; }
 
    .saved-screen { display: none; }
    .saved-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--bg-card); border: 0.5px solid var(--border); display: flex; align-items: center; justify-content: center; margin: 2rem auto 1.25rem; }
    .saved-icon i { font-size: 26px; color: var(--accent); }
    .saved-title { font-size: 17px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; text-align: center; }
    .saved-sub { font-size: 13px; color: var(--text-tertiary); margin-bottom: 1.5rem; text-align: center; }
 
    .sheets-badge-wrap { display: flex; justify-content: center; }
    .sheets-badge { display: inline-flex; align-items: center; gap: 5px; background: #E8F0E0; border: 0.5px solid #B8D0A0; border-radius: 8px; padding: 5px 12px; font-size: 12px; color: #4A6A30; margin-bottom: 1.5rem; }
 
    .saved-summary { border: 0.5px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 1.5rem; text-align: left; box-shadow: 0 1px 4px rgba(60,40,20,0.06); }
    .saved-meta { background: var(--bg-table-head); padding: 12px 16px; border-bottom: 0.5px solid var(--border); }
    .saved-meta-text { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .saved-meta-sub { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    .saved-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); }
    .saved-stat { padding: 14px 16px; background: var(--white-card); border-right: 0.5px solid var(--border-light); }
    .saved-stat:last-child { border-right: none; }
    .saved-stat-label { font-size: 11px; color: var(--text-tertiary); margin-bottom: 4px; }
    .saved-stat-num { font-size: 18px; font-weight: 600; color: var(--text-primary); }
 
    .sheets-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px; background: var(--accent);
      border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
      font-family: var(--font-sans); color: #F9F5EE; cursor: pointer;
      transition: background 0.15s; text-decoration: none; letter-spacing: 0.02em;
      margin-bottom: 10px;
    }
    .sheets-btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
<div class="app-wrap">
  <div id="edit-view">
    <div class="header">
      <div class="header-sub">Palm School · 12th</div>
      <div class="header-title">팜스쿨 12기 과제&amp;출결표</div>
    </div>
 
    <div class="meta-row">
      <div class="meta-field">
        <div class="meta-label">주차</div>
        <input 입력="text" id="week-input" placeholder="예) 3주차" oninput="updateSummary()" />
      </div>
      <div class="meta-field">
        <div class="meta-label">조 이름</div>
        <input 입력="text" id="group-input" placeholder="예) 5조" oninput="updateSummary()" />
      </div>
    </div>
 
    <div class="section-title-row">
      <div class="section-title">조원 명단</div>
    </div>
 
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>이름</th>
            <th>출석</th>
            <th>지각</th>
            <th>말씀</th>
            <th>전도</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
 
    <div class="summary-row">
      <div class="summary-card"><div class="s-label">출석</div><div class="s-num" id="sum-att">0 / 0</div></div>
      <div class="summary-card"><div class="s-label">지각</div><div class="s-num" id="sum-late">0 / 0</div></div>
      <div class="summary-card"><div class="s-label">말씀통독</div><div class="s-num" id="sum-word">0 / 0</div></div>
      <div class="summary-card"><div class="s-label">전도</div><div class="s-num" id="sum-evan">0 / 0</div></div>
    </div>
 
    <button class="save-btn" id="save-btn" onclick="saveData()">
      <i class="ti ti-device-floppy" aria-hidden="true" style="font-size:15px"></i>저장하기
    </button>
    <div class="footer">Palm School · 12기</div>
  </div>
 
  <div id="saved-view" class="saved-screen">
    <div class="header">
      <div class="header-sub">Palm School · 12th</div>
      <div class="header-title">팜스쿨 12기 과제&amp;출결표</div>
    </div>
    <div class="saved-icon"><i class="ti ti-circle-check" aria-hidden="true"></i></div>
    <div class="saved-title">저장 완료</div>
    <div class="saved-sub" id="saved-sub"></div>
    <div class="sheets-badge-wrap">
      <div class="sheets-badge" id="sheets-badge" style="display:none">
        <i class="ti ti-table" aria-hidden="true" style="font-size:14px"></i> 구글 시트에 전송됨
      </div>
    </div>
    <div class="saved-summary">
      <div class="saved-meta">
        <div class="saved-meta-text" id="saved-meta-title">—</div>
        <div class="saved-meta-sub" id="saved-meta-sub">—</div>
      </div>
      <div class="saved-stats">
        <div class="saved-stat"><div class="saved-stat-label">출석</div><div class="saved-stat-num" id="sv-att">—</div></div>
        <div class="saved-stat"><div class="saved-stat-label">지각</div><div class="saved-stat-num" id="sv-late">—</div></div>
        <div class="saved-stat"><div class="saved-stat-label">말씀통독</div><div class="saved-stat-num" id="sv-word">—</div></div>
        <div class="saved-stat"><div class="saved-stat-label">전도</div><div class="saved-stat-num" id="sv-evan">—</div></div>
      </div>
    </div>
 
    <a id="sheets-link" class="sheets-btn" href="#" target="_blank">
      <i class="ti ti-table" aria-hidden="true" style="font-size:15px"></i>제출내용 확인하기
    </a>
 
    <div class="footer">Palm School · 12기</div>
  </div>
</div>
 
<script>
  const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbznhj2zPMHja_ucDXngBKU3oEY8WBn-T2T_H9CdWmhaiVFWLHCe-Ej-z7s8dkLaHYoG/exec';
  const SHEET_URL   = 'https://docs.google.com/spreadsheets/d/12QQ-7SiHUkr5p_zYz5E3ouKS5Ek6brani0-EOcA2v1k/edit?gid=0#gid=0';
  let rowId = 0;
 
  function makeCheckBox(입력, id) {
    return `<div class="check-wrap"><div class="check-box" id="cb-${입력}-${id}" onclick="toggleCheck('${입력}',${id})"><i class="ti ti-check" aria-hidden="true"></i></div></div>`;
  }
 
  function addRow() {
    const id = rowId++;
    const tbody = document.getElementById('table-body');
    const tr = document.createElement('tr');
    tr.id = `row-${id}`;
    tr.innerHTML = `
      <td><input class="name-input" placeholder="이름" oninput="updateSummary()" /></td>
      <td>${makeCheckBox('att', id)}</td>
      <td>${makeCheckBox('late', id)}</td>
      <td>${makeCheckBox('word', id)}</td>
      <td>${makeCheckBox('evan', id)}</td>
    `;
    tbody.appendChild(tr);
    updateSummary();
  }
 
  function toggleCheck(입력, id) {
    document.getElementById(`cb-${입력}-${id}`).classList.toggle('active');
    updateSummary();
  }
 
  function namedRows() {
    return [...document.querySelectorAll('#table-body tr')].filter(tr => {
      const inp = tr.querySelector('.name-input');
      return inp && inp.value.trim() !== '';
    });
  }
 
  function getStats() {
    const rows = namedRows();
    const total = rows.length;
    let att = 0, late = 0, word = 0, evan = 0;
    rows.forEach(tr => {
      const id = tr.id.replace('row-', '');
      if (document.getElementById(`cb-att-${id}`)?.classList.contains('active')) att++;
      if (document.getElementById(`cb-late-${id}`)?.classList.contains('active')) late++;
      if (document.getElementById(`cb-word-${id}`)?.classList.contains('active')) word++;
      if (document.getElementById(`cb-evan-${id}`)?.classList.contains('active')) evan++;
    });
    return { total, att, late, word, evan };
  }
 
  function updateSummary() {
    const { total, att, late, word, evan } = getStats();
    document.getElementById('sum-att').textContent  = att  + ' / ' + total;
    document.getElementById('sum-late').textContent = late + ' / ' + total;
    document.getElementById('sum-word').textContent = word + ' / ' + total;
    document.getElementById('sum-evan').textContent = evan + ' / ' + total;
  }
 
  async function saveData() {
    const week  = document.getElementById('week-input').value.trim()  || '미입력';
    const group = document.getElementById('group-input').value.trim() || '미입력';
    const { total, att, late, word, evan } = getStats();
    const btn = document.getElementById('save-btn');
 
    const members = namedRows().map(tr => {
      const id = tr.id.replace('row-', '');
      return {
        name: tr.querySelector('.name-input').value.trim(),
        att:  !!document.getElementById(`cb-att-${id}`)?.classList.contains('active'),
        late: !!document.getElementById(`cb-late-${id}`)?.classList.contains('active'),
        word: !!document.getElementById(`cb-word-${id}`)?.classList.contains('active'),
        evan: !!document.getElementById(`cb-evan-${id}`)?.classList.contains('active'),
      };
    });
 
    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader" style="font-size:15px"></i>전송 중...';
 
    let sheetSent = false;
    try {
      await fetch(WEBHOOK_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ week, group, members })
      });
      sheetSent = true;
    } catch (err) {
      console.error('전송 오류:', err);
    }
 
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-device-floppy" style="font-size:15px"></i>저장하기';
 
    document.getElementById('saved-meta-title').textContent = group;
    document.getElementById('saved-meta-sub').textContent   = week + ' · 총 ' + total + '명';
    document.getElementById('saved-sub').textContent        = week + ' · ' + group + ' 출결이 저장되었습니다.';
    document.getElementById('sv-att').textContent  = att  + ' / ' + total;
    document.getElementById('sv-late').textContent = late + ' / ' + total;
    document.getElementById('sv-word').textContent = word + ' / ' + total;
    document.getElementById('sv-evan').textContent = evan + ' / ' + total;
    document.getElementById('sheets-badge').style.display = sheetSent ? 'inline-flex' : 'none';
    document.getElementById('sheets-link').href = SHEET_URL;
 
    document.getElementById('edit-view').style.display  = 'none';
    document.getElementById('saved-view').style.display = 'block';
  }
 
  ['','','','',''].forEach(() => addRow());
</script>
</body>
</html>
